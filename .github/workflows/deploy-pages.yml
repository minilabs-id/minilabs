name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Trigger lintas-repo: repo proyek (mis. minicode) kirim `update-docs` saat
  # docs-nya berubah, sehingga halaman dokumentasi ter-update SEKETIKA (tanpa
  # menunggu jadwal harian).
  repository_dispatch:
    types: ["update-docs"]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Cache klon docs agar build tidak selalu fetch dari nol; kunci berubah
      # tiap run tapi restore-key menahan salinan terakhir untuk di-`git pull`.
      - name: Cache project docs
        uses: actions/cache@v4
        with:
          path: .docs-cache
          key: docs-cache-${{ github.run_id }}
          restore-keys: |
            docs-cache-
      - name: Build site
        run: bun build.ts
      - name: Validate output
        run: bun check.ts
      # Cloudflare Pages: satu-satunya jalur yang bisa mengirim `_headers`
      # (cache immutable + keamanan). Di-skip otomatis selama secret belum diisi,
      # sehingga GitHub Pages tetap menjadi fallback.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler@4 pages deploy site --project-name minilabs --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'b019700808c64001ba7b5127fd9e316a' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
