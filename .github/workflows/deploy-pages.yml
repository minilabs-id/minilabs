name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Trigger lintas-repo: repo proyek (mis. minicode) kirim `update-docs` saat
  # docs-nya berubah, sehingga halaman dokumentasi ter-update SEKETIKA (tanpa
  # menunggu jadwal harian).
  repository_dispatch:
    types: ["update-docs"]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build site
        run: bun build.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4